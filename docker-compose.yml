services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kpc
      POSTGRES_USER: kpc
      # Synthetic demo credential only. Override with an .env file outside the demo.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kpc-demo}
    ports:
      # Host port 5433 avoids clashing with a locally installed PostgreSQL.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpc -d kpc"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://kpc:${POSTGRES_PASSWORD:-kpc-demo}@db:5432/kpc
      JWT_SECRET: ${JWT_SECRET:-synthetic-demo-only-change-in-production}
      # The end-to-end tests need the full illustrative dataset; a live demo starts from a small sample.
      SEED_PROFILE: ${SEED_PROFILE:-full}
    ports:
      - "8000:8000"
    volumes:
      - attachments:/app/storage/attachments
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      # The browser calls same-origin /api; Vite forwards it to the API container.
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # End-to-end tests: docker compose --profile e2e run --rm e2e  (see scripts/e2e.sh)
  e2e:
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    profiles: ["e2e"]
    working_dir: /work
    environment:
      E2E_BASE_URL: http://frontend:5173
      CI: "1"
    volumes:
      - ./frontend:/work
    ipc: host
    command: ["npx", "playwright", "test"]
    depends_on:
      - frontend

volumes:
  pgdata:
  attachments:
