# Render Blueprint: the KPC Maintenance API (FastAPI, Docker) and its PostgreSQL database.
# In Render: New > Blueprint > pick this repository. Values marked sync: false are asked for once.
# Illustrative demonstration data only; not connected to KPC systems.
databases:
  - name: kpc-maintenance-db
    databaseName: kpc
    user: kpc
    plan: free
    region: frankfurt

services:
  - type: web
    name: kpc-maintenance-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kpc-maintenance-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false   # the frontend's address, e.g. https://kpc-maintenance-web.onrender.com (comma-separate several)
      - key: APP_URL
        sync: false   # the same frontend address; used in email links
      - key: REPORTING_TIMEZONE
        value: Africa/Nairobi
      - key: ALLOWED_EMAIL_DOMAINS
        value: '["kpc.co.ke"]'
      - key: DEMO_MAILBOX
        value: "true"   # demonstration only: no real email is sent; set false before real use
      - key: REPORT_SCHEDULER
        value: "true"
      - key: JWT_LIFETIME_HOURS
        value: "12"
